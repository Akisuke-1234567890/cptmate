<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f5f63">
  <title>CPTmate</title>
  <link rel="stylesheet" href="style.css?v=0.2.17">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">NSCA-CPT LEARNING</div>
        <h1>CPTmate</h1>
      </div>
      <div class="topbar-spacer" aria-hidden="true"></div>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button data-nav="home" class="nav-btn active"><span>⌂</span><small>ホーム</small></button>
      <button data-nav="favorites" class="nav-btn"><span>☆</span><small>お気に入り</small></button>
      <button data-nav="review" class="nav-btn"><span>↻</span><small>復習</small></button>
      <button data-nav="stats" class="nav-btn"><span>▥</span><small>学習状況</small></button>
      <button data-nav="settings" class="nav-btn"><span>⚙</span><small>設定</small></button>
    </nav>
  </div>

  <script>
    // 毎回バージョン付きURLで読み込み、GitHub Pages/Safariの旧app.jsを使わない。
    const appScript = document.createElement("script");
    appScript.src = `app.js?v=0.2.17&t=${Date.now()}`;
    document.body.appendChild(appScript);
  </script>
</body>
</html>
