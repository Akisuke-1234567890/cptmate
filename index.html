<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f5f63">
  <title>CPTmate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">NSCA-CPT LEARNING</div>
        <h1>CPTmate</h1>
      </div>
      <button id="bookmarkFilterBtn" class="icon-btn" aria-label="ブックマーク">☆</button>
    </header>

    <main id="screen" class="screen"></main>

    <nav class="bottom-nav" aria-label="メインナビゲーション">
      <button data-nav="home" class="nav-btn active"><span>⌂</span><small>ホーム</small></button>
      <button data-nav="practice" class="nav-btn"><span>✓</span><small>問題</small></button>
      <button data-nav="review" class="nav-btn"><span>↻</span><small>復習</small></button>
      <button data-nav="stats" class="nav-btn"><span>▥</span><small>学習状況</small></button>
      <button data-nav="settings" class="nav-btn"><span>⚙</span><small>設定</small></button>
    </nav>
  </div>

  <script>
    const isUpdateReload = new URLSearchParams(location.search).has("update");
    const appScript = document.createElement("script");
    appScript.src = isUpdateReload ? `app.js?update=${Date.now()}` : "app.js";
    document.body.appendChild(appScript);
  </script>
</body>
</html>
