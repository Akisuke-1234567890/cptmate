<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img">
<defs>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".12"/></filter>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f6b70"/></marker>
 <marker id="arrowGold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#b4883b"/></marker>
</defs>
<rect width="1200" height="820" rx="34" fill="#f7fbfb"/>
<text x="70" y="70" font-family="Noto Sans CJK JP, sans-serif" font-size="32" font-weight="700" fill="#173e41">長骨の構造と骨リモデリング</text>
<text x="70" y="105" font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#70888a">骨端・骨幹・骨髄腔と、骨芽細胞／破骨細胞の役割</text>
<rect x="55" y="135" width="720" height="575" rx="28" fill="#fff" stroke="#d7dfe0" stroke-width="2" filter="url(#shadow)"/>
<text x="90" y="180" font-family="Noto Sans CJK JP, sans-serif" font-size="25" font-weight="700" fill="#8b6b2b">長骨の主な構造</text>
<!-- stylized long bone -->
<path d="M260 230 C165 225 120 290 135 355 C145 400 185 420 225 430 L225 585 C180 595 145 625 145 675 C145 705 165 720 195 720 L515 720 C545 720 565 705 565 675 C565 625 530 595 485 585 L485 430 C525 420 565 400 575 355 C590 290 545 225 440 230 Z" transform="translate(0,-30)" fill="#f4d79c" stroke="#b4893f" stroke-width="5"/>
<!-- medullary cavity -->
<path d="M285 280 C245 300 230 330 240 365 C250 395 275 405 305 410 L305 575 C270 585 255 610 255 650 C255 670 270 680 292 680 L418 680 C440 680 455 670 455 650 C455 610 440 585 405 575 L405 410 C435 405 460 395 470 365 C480 330 465 300 425 280 Z" transform="translate(0,-30)" fill="#fff7df" stroke="#d0a45a" stroke-width="4"/>
<!-- trabecular at epiphysis -->
<path d="M175 300 l80 35 l-65 35 l100 35 M505 300 l-80 35 l65 35 l-100 35" transform="translate(0,-30)" fill="none" stroke="#c79b51" stroke-width="5" opacity=".7"/>
<!-- labels -->
<line x1="580" y1="225" x2="690" y2="195" stroke="#0f6b70" stroke-width="3"/>
<text x="695" y="198" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" fill="#173e41">骨端</text>
<text x="695" y="223" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#6a8082">関節側の端</text>
<line x1="485" y1="420" x2="690" y2="420" stroke="#0f6b70" stroke-width="3"/>
<text x="695" y="425" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" fill="#173e41">骨幹</text>
<text x="695" y="450" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#6a8082">中央の長い部分</text>
<line x1="455" y1="540" x2="690" y2="520" stroke="#0f6b70" stroke-width="3"/>
<text x="695" y="525" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" fill="#173e41">骨髄腔</text>
<text x="695" y="550" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#6a8082">骨幹内部の空間</text>
<line x1="225" y1="520" x2="110" y2="520" stroke="#b4893f" stroke-width="3"/>
<text x="70" y="515" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" fill="#8b6b2b">皮質骨</text>
<text x="70" y="540" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#6a8082">緻密で強い外層</text>
<!-- remodeling panel -->
<rect x="810" y="135" width="335" height="575" rx="28" fill="#fff" stroke="#d7dfe0" stroke-width="2" filter="url(#shadow)"/>
<text x="840" y="180" font-family="Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700" fill="#173e41">骨リモデリング</text>
<text x="840" y="215" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#6a8082">骨吸収と骨形成が継続する</text>
<circle cx="885" cy="300" r="52" fill="#e9aaa5" stroke="#b75c58" stroke-width="4"/><text x="885" y="307" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" fill="#7d3734">破骨細胞</text>
<line x1="940" y1="300" x2="1010" y2="300" stroke="#b75c58" stroke-width="4" marker-end="url(#arrow)"/>
<text x="975" y="278" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#7d3734">骨吸収</text>
<circle cx="1070" cy="300" r="52" fill="#b8dcd7" stroke="#3d8885" stroke-width="4"/><text x="1070" y="307" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" fill="#1c6562">骨芽細胞</text>
<text x="970" y="390" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#6a8082">骨形成</text>
<path d="M1070 355 C1070 405 900 405 900 455" fill="none" stroke="#3d8885" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="850" y="475" width="255" height="110" rx="20" fill="#eef7f6"/>
<text x="975" y="510" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="18" font-weight="700" fill="#173e41">ウォルフの法則</text>
<text x="975" y="542" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#506c6e">骨は加わる負荷に応じて</text>
<text x="975" y="566" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#506c6e">構造・強度を適応させる</text><text x="600" y="785" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#809294">※ 模式図。実際の形状・比率とは異なる場合があります。</text></svg>