<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbfb"/><stop offset="1" stop-color="#eef7f6"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#145e62"/><stop offset="1" stop-color="#2d8585"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#163f43" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="800" fill="#173f43">長骨の主な構造と骨リモデリング</text>
<text x="60" y="98" font-family="sans-serif" font-size="18" fill="#6b8587">骨幹・骨端と、骨形成／骨吸収に関わる細胞</text>
<!-- long bone -->
<path d="M230 170 C175 170 135 215 135 270 C135 325 175 355 220 370 L220 470 C175 485 135 515 135 570 C135 625 175 670 230 670 L360 670 C415 670 455 625 455 570 C455 515 415 485 370 470 L370 370 C415 355 455 325 455 270 C455 215 415 170 360 170Z" fill="#f4d9a6" stroke="#a97d3c" stroke-width="6"/>
<path d="M230 205 C195 205 170 235 170 275 C170 315 195 335 245 345 L245 495 C195 505 170 525 170 565 C170 605 195 635 230 635 L360 635 C395 635 420 605 420 565 C420 525 395 505 345 495 L345 345 C395 335 420 315 420 275 C420 235 395 205 360 205Z" fill="#f8e9c9" stroke="#d4a963" stroke-width="4"/>
<path d="M245 345 H345 M245 495 H345" stroke="#b78c4d" stroke-width="3" stroke-dasharray="8 8"/>
<rect x="245" y="345" width="100" height="150" rx="12" fill="#fffaf0" stroke="#d4a963" stroke-width="3"/>
<path d="M260 365 h70 M260 390 h70 M260 415 h70 M260 440 h70 M260 465 h70" stroke="#c8a46a" stroke-width="5" opacity=".7"/>
<g font-family="sans-serif" fill="#173f43"><text x="520" y="215" font-size="21" font-weight="800">骨端</text><text x="520" y="245" font-size="16" fill="#607879">長骨の両端</text><path d="M470 230 H405" stroke="#237477" stroke-width="4"/>
<text x="520" y="330" font-size="21" font-weight="800">骨幹</text><text x="520" y="360" font-size="16" fill="#607879">長骨の中央の長い部分</text><path d="M470 345 H365" stroke="#237477" stroke-width="4"/>
<text x="520" y="455" font-size="21" font-weight="800">骨髄腔</text><text x="520" y="485" font-size="16" fill="#607879">骨幹内部の空間</text><path d="M470 470 H345" stroke="#237477" stroke-width="4"/>
<text x="520" y="575" font-size="21" font-weight="800">骨膜</text><text x="520" y="605" font-size="16" fill="#607879">骨の外側を覆う膜</text><path d="M470 590 H205" stroke="#237477" stroke-width="4"/></g>
<!-- remodeling panel -->
<g><rect x="760" y="150" width="350" height="500" rx="26" fill="#fff" stroke="#c8dfdd" stroke-width="3"/></g>
<text x="935" y="195" font-family="sans-serif" text-anchor="middle" font-size="22" font-weight="800" fill="#145e62">骨リモデリング</text>
<text x="935" y="225" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#718889">古い骨を吸収 → 新しい骨を形成</text>
<circle cx="850" cy="315" r="55" fill="#e7b5aa" stroke="#a95c53" stroke-width="5"/><circle cx="850" cy="315" r="27" fill="#fff"/><text x="850" y="385" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="800" fill="#9b5048">破骨細胞</text><text x="850" y="412" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#6e8080">骨吸収</text>
<path d="M910 315 H960" stroke="#8daaa9" stroke-width="5"/><path d="M950 305 l16 10 -16 10z" fill="#8daaa9"/>
<circle cx="1020" cy="315" r="55" fill="#b9d9d2" stroke="#3f817c" stroke-width="5"/><circle cx="1020" cy="315" r="20" fill="#fff"/><text x="1020" y="385" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="800" fill="#2c6f6a">骨芽細胞</text><text x="1020" y="412" font-family="sans-serif" text-anchor="middle" font-size="14" fill="#6e8080">骨形成</text>
<rect x="800" y="465" width="270" height="125" rx="18" fill="#eef7f6"/><text x="935" y="500" font-family="sans-serif" text-anchor="middle" font-size="18" font-weight="800" fill="#145e62">ウォルフの法則</text><text x="935" y="532" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#526f71">骨は加えられたストレス</text><text x="935" y="558" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#526f71">（負荷）に応じて適応する</text>
<text x="600" y="710" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#718889">※ 模式図。各構造の位置関係を理解するための図です。</text>
</svg>