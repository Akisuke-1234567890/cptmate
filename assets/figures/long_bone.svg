<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#fff"/>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;fill:#173f42}.h{font-size:38px;font-weight:800}.sh{font-size:28px;font-weight:800}.tx{font-size:22px}.sm{font-size:19px}.b{font-weight:800}.panel{fill:#fbfdfd;stroke:#d4e1e2;stroke-width:3}</style>
<text x="55" y="60" class="t h">長骨の構造と骨リモデリング</text>
<rect x="45" y="90" width="1310" height="680" rx="24" class="panel"/>
<line x1="780" y1="120" x2="780" y2="735" stroke="#c7d3d4" stroke-width="2"/>
<text x="90" y="145" class="t sh">長骨の主な構造</text>
<text x="820" y="145" class="t sh">骨リモデリング（骨代謝のバランス）</text>
<!-- bone -->
<path d="M180 215 C145 245 145 305 190 330 L190 570 C145 595 145 655 180 685 C215 715 280 700 305 665 L305 230 C280 195 215 185 180 215Z" fill="#f4d28f" stroke="#c28a37" stroke-width="5"/>
<path d="M205 245 C180 270 180 300 215 320 L215 580 C180 600 180 630 205 655 C230 675 265 665 285 640 L285 260 C265 235 230 225 205 245Z" fill="#fff2cf"/>
<path d="M215 330 L285 330 L285 570 L215 570Z" fill="#f0e5c4"/>
<path d="M230 360 L270 360 L270 540 L230 540Z" fill="#6f4d36" opacity=".65"/>
<path d="M180 215 C145 245 145 305 190 330 L190 570 C145 595 145 655 180 685" fill="none" stroke="#d7a84e" stroke-width="10"/>
<text x="350" y="250" class="t sm">骨端</text><line x1="340" y1="245" x2="280" y2="280" stroke="#173f42" stroke-width="2"/>
<text x="350" y="325" class="t sm">関節面／関節軟骨</text><line x1="340" y1="315" x2="255" y2="250" stroke="#173f42" stroke-width="2"/>
<text x="350" y="430" class="t sm">骨幹</text><line x1="340" y1="425" x2="285" y2="425" stroke="#173f42" stroke-width="2"/>
<text x="350" y="485" class="t sm">骨髄腔</text><line x1="340" y1="480" x2="270" y2="480" stroke="#173f42" stroke-width="2"/>
<text x="350" y="545" class="t sm">皮質骨（緻密骨）</text><line x1="340" y1="540" x2="205" y2="540" stroke="#173f42" stroke-width="2"/>
<text x="350" y="605" class="t sm">海綿骨（柱状骨）</text><line x1="340" y1="600" x2="220" y2="630" stroke="#173f42" stroke-width="2"/>
<text x="350" y="665" class="t sm">骨膜</text><line x1="340" y1="660" x2="195" y2="650" stroke="#173f42" stroke-width="2"/>
<!-- remodeling -->
<circle cx="940" cy="330" r="90" fill="#fde1de" stroke="#c95a4f" stroke-width="4"/><circle cx="1170" cy="330" r="90" fill="#e1f2e8" stroke="#4b9a78" stroke-width="4"/>
<text x="895" y="320" class="t tx b">破骨細胞</text><text x="900" y="350" class="t sm">骨吸収</text>
<text x="1125" y="320" class="t tx b">骨芽細胞</text><text x="1130" y="350" class="t sm">骨形成</text>
<path d="M1025 285 C1050 250 1090 250 1110 275" fill="none" stroke="#2d6870" stroke-width="7"/><polygon points="1100,265 1125,275 1107,290" fill="#2d6870"/>
<path d="M1110 385 C1080 420 1035 420 1010 395" fill="none" stroke="#2d6870" stroke-width="7"/><polygon points="1018,405 995,395 1012,380" fill="#2d6870"/>
<text x="915" y="465" class="t tx b">骨は常に再形成される</text>
<rect x="850" y="500" width="470" height="120" rx="18" fill="#eef7f6"/>
<text x="880" y="540" class="t tx b">ウォルフの法則</text>
<text x="880" y="578" class="t sm">骨は課せられたストレスに適応する</text>
<text x="880" y="606" class="t sm">荷重・レジスタンス運動 → 骨密度への刺激</text>
<rect x="45" y="790" width="1310" height="70" rx="18" fill="#fff4e8"/>
<text x="75" y="833" class="t tx">皮質骨＝硬く緻密／海綿骨＝密度が低い。骨芽細胞＝形成、破骨細胞＝吸収。</text>
</svg>