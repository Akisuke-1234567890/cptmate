<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" fill="#fff"/>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Yu Gothic',sans-serif;fill:#173f42}
.h{font-size:34px;font-weight:800} .sh{font-size:24px;font-weight:800} .tx{font-size:21px} .sm{font-size:18px} .bold{font-weight:800}
.panel{fill:#f8fbfb;stroke:#cbdedf;stroke-width:2} .teal{fill:#176f73} .blue{fill:#2868a8} .orange{fill:#d97918} .green{fill:#3e8b69} .red{fill:#b44d4d}
.line{stroke:#176f73;stroke-width:5;fill:none} .thin{stroke:#6c8789;stroke-width:2;fill:none}
</style>
<text x="60" y="62" class="t h">長骨の構造と骨リモデリング</text>

<rect x="50" y="90" width="680" height="570" rx="24" class="panel"/><rect x="760" y="90" width="390" height="570" rx="24" class="panel"/>
<text x="80" y="132" class="t sh">長骨の構造</text><text x="790" y="132" class="t sh">骨リモデリング</text>
<!-- bone -->
<path d="M250 185 Q150 185 145 275 L170 360 L145 500 Q150 590 250 590 L330 590 Q430 590 435 500 L410 360 L435 275 Q430 185 330 185Z" fill="#f0d08b" stroke="#b77a32" stroke-width="5"/>
<path d="M250 215 Q205 215 205 280 L225 360 L205 495 Q205 555 250 555 L330 555 Q375 555 375 495 L355 360 L375 280 Q375 215 330 215Z" fill="#fff2c9" stroke="#c58b42" stroke-width="3"/>
<path d="M250 225 Q235 225 230 275 L248 360 L230 495 Q230 530 250 530 L330 530 Q350 530 350 495 L332 360 L350 275 Q345 225 330 225Z" fill="#e9e0c9"/>
<rect x="248" y="300" width="84" height="120" rx="30" fill="#d87555"/>
<text x="470" y="220" class="t sm">骨端</text><line x1="460" y1="225" x2="365" y2="245" class="thin"/><text x="470" y="320" class="t sm">骨幹</text><line x1="460" y1="325" x2="350" y2="350" class="thin"/><text x="470" y="420" class="t sm">骨髄腔（骨髄）</text><line x1="460" y1="425" x2="330" y2="420" class="thin"/><text x="470" y="520" class="t sm">皮質骨・骨膜</text><line x1="460" y1="525" x2="350" y2="505" class="thin"/>
<text x="90" y="630" class="t sm">海綿骨（骨小柱）・関節軟骨なども部位に応じて配置</text>
<!-- remodeling -->
<circle cx="850" cy="270" r="82" fill="#fff0ef" stroke="#c96a65" stroke-width="4"/><circle cx="1050" cy="270" r="82" fill="#eef8f2" stroke="#4f9b75" stroke-width="4"/>
<text x="850" y="260" text-anchor="middle" class="t sm bold">破骨細胞</text><text x="850" y="290" text-anchor="middle" class="t sm">骨吸収</text>
<text x="1050" y="260" text-anchor="middle" class="t sm bold">骨芽細胞</text><text x="1050" y="290" text-anchor="middle" class="t sm">骨形成</text>
<path d="M925 220 Q955 175 1000 205" stroke="#176f73" stroke-width="7" fill="none"/><path d="M1000 335 Q955 375 905 340" stroke="#176f73" stroke-width="7" fill="none"/>
<text x="955" y="430" text-anchor="middle" class="t tx bold">骨代謝のバランス</text>
<rect x="805" y="470" width="300" height="120" rx="18" fill="#eaf4f4"/><text x="955" y="505" text-anchor="middle" class="t sm bold">ウォルフの法則</text><text x="955" y="540" text-anchor="middle" class="t sm">骨は加わる負荷に</text><text x="955" y="568" text-anchor="middle" class="t sm">適応して変化する</text>

<text x="60" y="728" class="t sm" fill="#708487">※ CPTmate学習用模式図。教材の構造・関係を学習しやすい形に再構成。</text>
