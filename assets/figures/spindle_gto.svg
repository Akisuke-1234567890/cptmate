<rect x="80" y="620" width="970" height="28" rx="14" fill="#eaf4f4"/><text x="600" y="642" text-anchor="middle" class="t sm">筋紡錘＝長さ・伸張　／　GTO＝張力・力</text>

<text x="60" y="728" class="t sm" fill="#708487">※ CPTmate学習用模式図。教材の構造・関係を学習しやすい形に再構成。</text>
