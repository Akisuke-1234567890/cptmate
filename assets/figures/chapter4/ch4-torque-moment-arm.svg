<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">トルクとモーメントアーム</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">力の作用線と回転軸の距離が、回転させる効果を決める</text>
<rect x="70" y="130" width="1060" height="360" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><line x1="170" y1="330" x2="1030" y2="330" stroke="#173f52" stroke-width="14"/><circle cx="170" cy="330" r="24" fill="#2c7a7b"/><text x="170" y="385" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">回転軸</text><line x1="650" y1="170" x2="650" y2="470" stroke="#7d9aa0" stroke-width="3" stroke-dasharray="10 10"/><line x1="820" y1="170" x2="820" y2="300" stroke="#2c7a7b" stroke-width="9"/><polygon points="820,300 802,290 802,310" fill="#2c7a7b"/><text x="835" y="210" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="28" font-weight="700" fill="#2c7a7b">F</text><text x="650" y="515" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="700" fill="#5f747a">力の作用線</text><line x1="170" y1="575" x2="650" y2="575" stroke="#173f52" stroke-width="5"/><polygon points="650,575 632,565 632,585" fill="#173f52"/><text x="410" y="620" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="700" fill="#173f52">モーメントアーム d（軸から作用線までの垂直距離）</text><rect x="300" y="145" width="600" height="90" rx="16" fill="#eaf2f3" stroke="#7d9aa0" stroke-width="2"/><text x="600" y="205" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">T = F × d</text><text x="600" y="670" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#5f747a">同じ力Fでも、dが大きいほどトルクTは大きくなる</text></svg>
