<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="32" fill="#f7fbfb"/>
<text x="60" y="58" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">図4.2 トルクとモーメントアーム</text>
<text x="60" y="94" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" fill="#5f747a">回転軸・力の作用線・垂直距離の関係</text>
<rect x="100" y="150" width="1000" height="400" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><line x1="180" y1="390" x2="980" y2="390" stroke="#173f52" stroke-width="10"/><circle cx="300" cy="390" r="18" fill="#173f52"/><text x="300" y="440" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="500" fill="#173f52">回転軸</text><line x1="300" y1="220" x2="300" y2="390" stroke="#8a5a2b" stroke-width="4" stroke-dasharray="10 10"/><line x1="700" y1="390" x2="700" y2="220" stroke="#8a5a2b" stroke-width="4" stroke-dasharray="10 10"/><polygon points="690,230 700,205 710,230" fill="#8a5a2b"/><text x="700" y="195" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="24" font-weight="700" fill="#8a5a2b">力 F</text><text x="500" y="360" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="19" font-weight="500" fill="#173f52">d = モーメントアーム（軸から力の作用線までの垂直距離）</text><text x="600" y="500" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">T = F × d</text><text x="600" y="550" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">同じ力でも d が大きいほどトルクは大きい</text>
</svg>