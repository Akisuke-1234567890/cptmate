<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">力-速度関係とRFD</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">短縮性では速度が上がるほど力が低下。RFDは力の立ち上がりの速さ</text>
<rect x="60" y="125" width="620" height="480" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="370" y="165" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="24" font-weight="700" fill="#173f52">短縮性筋活動：力-速度関係</text><line x1="140" y1="535" x2="610" y2="535" stroke="#173f52" stroke-width="4"/><line x1="140" y1="535" x2="140" y2="205" stroke="#173f52" stroke-width="4"/><text x="370" y="575" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="700" fill="#173f52">短縮速度 →</text><text x="100" y="250" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="700" fill="#173f52">力</text><path d="M165 230 C260 260 350 330 430 400 C500 455 560 495 610 515" fill="none" stroke="#2c7a7b" stroke-width="9"/><text x="180" y="225" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="700" fill="#2c7a7b">高い力</text><text x="520" y="500" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="700" fill="#2c7a7b">高い速度</text><rect x="735" y="125" width="405" height="480" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="937" y="165" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="30" font-weight="700" fill="#173f52">RFD</text><text x="937" y="205" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="17" font-weight="500" fill="#5f747a">Rate of Force Development</text><line x1="800" y1="535" x2="1080" y2="535" stroke="#173f52" stroke-width="4"/><line x1="800" y1="535" x2="800" y2="245" stroke="#173f52" stroke-width="4"/><text x="940" y="575" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="700" fill="#173f52">時間 →</text><text x="760" y="270" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="700" fill="#173f52">力</text><path d="M815 520 C850 500 875 470 900 405 C925 345 950 300 1080 285" fill="none" stroke="#8a5a2b" stroke-width="9"/><text x="1000" y="330" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="700" fill="#8a5a2b">立ち上がりが速い</text><text x="600" y="665" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#5f747a">短時間の爆発的動作では、最大筋力だけでなくRFDが重要</text></svg>
