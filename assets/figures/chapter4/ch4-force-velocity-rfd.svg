<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="#fff"/>
<text x="50" y="58" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#173f42">力-速度関係とRFD</text>
<g font-family="Arial, 'Noto Sans JP', sans-serif" fill="#222">
<text x="260" y="115" text-anchor="middle" font-size="23" font-weight="700">短縮性：速度↑ → 力↓</text>
<line x1="80" y1="500" x2="450" y2="500" stroke="#444" stroke-width="3"/><line x1="80" y1="500" x2="80" y2="150" stroke="#444" stroke-width="3"/><path d="M110 190 C180 230 250 330 420 470" fill="none" stroke="#174f52" stroke-width="8"/><text x="260" y="535" text-anchor="middle" font-size="18">収縮速度</text><text x="35" y="330" transform="rotate(-90 35 330)" font-size="18">発揮筋力</text>
<text x="735" y="115" text-anchor="middle" font-size="23" font-weight="700">RFD：力の立ち上がり</text>
<line x1="560" y1="500" x2="930" y2="500" stroke="#444" stroke-width="3"/><line x1="560" y1="500" x2="560" y2="150" stroke="#444" stroke-width="3"/><path d="M590 480 L660 390 L735 320 L850 285 L900 285" fill="none" stroke="#c55" stroke-width="8"/><text x="745" y="535" text-anchor="middle" font-size="18">時間</text><text x="520" y="330" transform="rotate(-90 520 330)" font-size="18">力</text><text x="735" y="585" text-anchor="middle" font-size="17">0.5秒未満では最大筋力よりRFDが重要になりやすい</text></g>
</svg>