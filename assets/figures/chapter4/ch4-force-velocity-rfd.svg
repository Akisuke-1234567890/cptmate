<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="32" fill="#f7fbfb"/>
<text x="60" y="58" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">図4.10 力-速度関係とRFD</text>
<text x="60" y="94" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" fill="#5f747a">短縮性筋活動の力-速度関係と力の立ち上がり率</text>
<rect x="70" y="145" width="520" height="400" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="610" y="145" width="520" height="400" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><text x="330" y="190" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#173f52">力-速度関係</text><line x1="150" y1="470" x2="520" y2="470" stroke="#173f52" stroke-width="4"/><line x1="150" y1="470" x2="150" y2="220" stroke="#173f52" stroke-width="4"/><path d="M170 245 C250 275 330 350 500 455" fill="none" stroke="#173f52" stroke-width="8"/><text x="335" y="515" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="700" fill="#173f52">短縮速度 ↑ → 発揮筋力 ↓</text><text x="870" y="190" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">RFD（力の立ち上がり率）</text><line x1="690" y1="470" x2="1050" y2="470" stroke="#173f52" stroke-width="4"/><line x1="690" y1="470" x2="690" y2="220" stroke="#173f52" stroke-width="4"/><path d="M710 450 C760 440 790 360 830 300 C870 250 930 245 1020 245" fill="none" stroke="#8a5a2b" stroke-width="8"/><text x="870" y="515" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="700" fill="#173f52">力をどれだけ速く発揮できるか</text><text x="600" y="610" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">速度と力の関係、および力発揮速度を別々に捉える</text>
</svg>