<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">長さ-張力関係</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">筋長が変わると、能動的要素と受動的要素の張力が変化する</text>
<line x1="120" y1="570" x2="1080" y2="570" stroke="#173f52" stroke-width="4"/><line x1="150" y1="600" x2="150" y2="150" stroke="#173f52" stroke-width="4"/><text x="600" y="625" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">筋長 →</text><text x="85" y="260" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">張力</text><path d="M180 545 C300 520 360 320 500 270 C620 225 700 330 800 480" fill="none" stroke="#2c7a7b" stroke-width="8"/><path d="M180 555 C600 555 750 550 850 500 C950 430 1030 260 1060 180" fill="none" stroke="#8a5a2b" stroke-width="8"/><path d="M180 550 C320 540 420 470 520 420 C650 360 760 330 860 280 C960 230 1020 185 1060 165" fill="none" stroke="#173f52" stroke-width="7"/><text x="850" y="230" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#8a5a2b">受動的要素</text><text x="760" y="300" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">総張力</text><text x="530" y="260" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#2c7a7b">能動的要素</text><rect x="220" y="170" width="340" height="70" rx="14" fill="#eaf2f3" stroke="#7d9aa0" stroke-width="2"/><text x="390" y="215" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="700" fill="#173f52">至適長付近で能動的張力が最大</text></svg>
