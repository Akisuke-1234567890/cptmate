<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="#fff"/>
<text x="50" y="58" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#173f42">オープンチェーンとクローズドチェーン</text>
<g font-family="Arial, 'Noto Sans JP', sans-serif" fill="#222">
<text x="255" y="115" text-anchor="middle" font-size="25" font-weight="700">オープンチェーン</text><text x="745" y="115" text-anchor="middle" font-size="25" font-weight="700">クローズドチェーン</text>
<rect x="70" y="160" width="370" height="320" rx="20" fill="#f7f9f9" stroke="#9aa"/><rect x="560" y="160" width="370" height="320" rx="20" fill="#f7f9f9" stroke="#9aa"/>
<!-- open arm --> <circle cx="190" cy="330" r="30" fill="#174f52"/><line x1="220" y1="330" x2="330" y2="250" stroke="#174f52" stroke-width="24" stroke-linecap="round"/><line x1="330" y1="250" x2="405" y2="250" stroke="#174f52" stroke-width="18" stroke-linecap="round"/><path d="M400 250 l-20 -12 v24 z" fill="#c55"/><text x="255" y="425" text-anchor="middle" font-size="18">末端が自由</text>
<!-- closed squat-ish --> <circle cx="690" cy="305" r="28" fill="#174f52"/><line x1="718" y1="305" x2="790" y2="385" stroke="#174f52" stroke-width="22" stroke-linecap="round"/><line x1="790" y1="385" x2="835" y2="455" stroke="#174f52" stroke-width="20" stroke-linecap="round"/><rect x="810" y="455" width="80" height="18" rx="8" fill="#555"/><text x="745" y="425" text-anchor="middle" font-size="18">末端が固定され、関節が連動</text>
<text x="500" y="535" text-anchor="middle" font-size="20" font-weight="700">オープン／クローズドと単関節／多関節は別の分類軸</text></g>
</svg>