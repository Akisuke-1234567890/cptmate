<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="32" fill="#f7fbfb"/>
<text x="60" y="58" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">図4.12 キネマティックチェーン</text>
<text x="60" y="94" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" fill="#5f747a">末端条件と関節間の連動性による区別</text>
<rect x="70" y="145" width="500" height="400" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="630" y="145" width="500" height="400" rx="20" fill="#fff" stroke="#b58b56" stroke-width="2"/><text x="320" y="190" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#173f52">オープンチェーン</text><text x="320" y="225" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="500" fill="#173f52">末端が自由に動く</text><line x1="180" y1="360" x2="300" y2="300" stroke="#173f52" stroke-width="18"/><line x1="300" y1="300" x2="430" y2="360" stroke="#173f52" stroke-width="18"/><circle cx="180" cy="360" r="22" fill="#173f52"/><circle cx="430" cy="360" r="22" fill="#173f52"/><text x="320" y="440" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">末端が固定されない</text><text x="320" y="480" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="18" font-weight="500" fill="#173f52">例：アームカール、レッグカール</text><text x="880" y="190" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="27" font-weight="700" fill="#8a5a2b">クローズドチェーン</text><text x="880" y="225" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="500" fill="#173f52">末端が固定・接地して動く</text><line x1="740" y1="360" x2="850" y2="300" stroke="#173f52" stroke-width="18"/><line x1="850" y1="300" x2="980" y2="360" stroke="#173f52" stroke-width="18"/><circle cx="740" cy="360" r="22" fill="#173f52"/><circle cx="980" cy="360" r="22" fill="#173f52"/><line x1="980" y1="260" x2="980" y2="470" stroke="#8a5a2b" stroke-width="10"/><text x="980" y="505" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="18" font-weight="700" fill="#8a5a2b">固定端</text><text x="880" y="440" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="700" fill="#173f52">末端条件により関節間の動きが連動</text><text x="600" y="610" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">単関節／多関節とは別の分類軸</text>
</svg>