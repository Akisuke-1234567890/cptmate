<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">オープンチェーンとクローズドチェーン</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">末端条件と関節間の連動性で区別する</text>
<rect x="70" y="135" width="490" height="440" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="315" y="180" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="27" font-weight="700" fill="#2c7a7b">オープンチェーン</text><text x="315" y="220" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="500" fill="#5f747a">末端が自由に動く</text><circle cx="190" cy="340" r="20" fill="#173f52"/><line x1="210" y1="340" x2="355" y2="300" stroke="#173f52" stroke-width="14"/><circle cx="375" cy="300" r="20" fill="#173f52"/><text x="315" y="525" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="17" font-weight="500" fill="#5f747a">関節の動きは単関節／多関節とは別の分類</text><rect x="640" y="135" width="490" height="440" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="885" y="180" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="27" font-weight="700" fill="#8a5a2b">クローズドチェーン</text><text x="885" y="220" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="500" fill="#5f747a">末端が固定・接地して動く</text><circle cx="760" cy="340" r="20" fill="#173f52"/><line x1="780" y1="340" x2="925" y2="300" stroke="#173f52" stroke-width="14"/><circle cx="945" cy="300" r="20" fill="#173f52"/><text x="885" y="525" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="17" font-weight="500" fill="#5f747a">関節の動きは単関節／多関節とは別の分類</text><text x="600" y="665" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#5f747a">「末端が自由か、固定・接地しているか」を最初に確認する</text></svg>
