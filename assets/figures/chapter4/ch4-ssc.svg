<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">伸張-短縮サイクル（SSC）</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">伸張性筋活動の直後に短縮性筋活動を行う一連の動き</text>
<rect x="80" y="155" width="290" height="300" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="225" y="205" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#8a5a2b">① 伸張性</text><text x="225" y="260" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">筋が力を発揮しながら伸ばされる</text><rect x="455" y="155" width="290" height="300" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="600" y="205" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">② 切り返し</text><text x="600" y="260" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">短い移行局面</text><line x1="545" y1="365" x2="655" y2="365" stroke="#173f52" stroke-width="8"/><text x="600" y="410" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="700" fill="#173f52">最小限にする</text><rect x="830" y="155" width="290" height="300" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="975" y="205" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#2c7a7b">③ 短縮性</text><text x="975" y="260" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">筋が力を発揮しながら短くなる</text><line x1="370" y1="300" x2="430" y2="300" stroke="#173f52" stroke-width="7"/><polygon points="430,300 412,290 412,310" fill="#173f52"/><line x1="745" y1="300" x2="805" y2="300" stroke="#173f52" stroke-width="7"/><polygon points="805,300 787,290 787,310" fill="#173f52"/><rect x="300" y="500" width="600" height="95" rx="16" fill="#eaf2f3" stroke="#7d9aa0" stroke-width="2"/><text x="600" y="540" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">弾性エネルギーの貯蔵・反射的応答・動員増加が発揮力に寄与</text></svg>
