<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="32" fill="#f7fbfb"/>
<text x="60" y="58" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">図4.11 伸張-短縮サイクル（SSC）</text>
<text x="60" y="94" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" fill="#5f747a">伸張性筋活動から短縮性筋活動への連続した移行</text>
<rect x="70" y="160" width="300" height="330" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="450" y="160" width="300" height="330" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="830" y="160" width="300" height="330" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><text x="220" y="205" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="26" font-weight="700" fill="#173f52">① 伸張性</text><text x="220" y="260" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="19" font-weight="500" fill="#173f52">筋が力を発揮しながら</text><text x="220" y="295" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">伸ばされる</text><text x="600" y="205" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="26" font-weight="700" fill="#173f52">② 切り返し</text><text x="600" y="260" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="500" fill="#173f52">短い移行局面</text><text x="600" y="305" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="24" font-weight="700" fill="#173f52">伸張 → 短縮</text><text x="980" y="205" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="26" font-weight="700" fill="#173f52">③ 短縮性</text><text x="980" y="260" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="19" font-weight="500" fill="#173f52">筋が短縮しながら</text><text x="980" y="295" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">力を発揮する</text><line x1="370" y1="325" x2="450" y2="325" stroke="#173f52" stroke-width="7"/><line x1="750" y1="325" x2="830" y2="325" stroke="#173f52" stroke-width="7"/><text x="600" y="570" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">伸張直後の短縮では、SSCにより力発揮が高まる</text>
</svg>