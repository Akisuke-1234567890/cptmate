<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="32" fill="#f7fbfb"/>
<text x="60" y="58" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">図4.7 仕事とパワー</text>
<text x="60" y="94" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" fill="#5f747a">力・移動距離・時間・速度の関係</text>
<rect x="80" y="150" width="500" height="360" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="620" y="150" width="500" height="360" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><text x="330" y="200" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="28" font-weight="700" fill="#173f52">仕事 Work</text><text x="330" y="255" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">力 F</text><line x1="200" y1="320" x2="450" y2="320" stroke="#173f52" stroke-width="8"/><text x="330" y="365" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="500" fill="#173f52">移動距離 d</text><text x="330" y="445" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">W = F × d</text><text x="870" y="200" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="28" font-weight="700" fill="#173f52">パワー Power</text><text x="870" y="255" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="500" fill="#173f52">仕事 W を時間 t で割る</text><text x="870" y="340" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">P = W / t</text><text x="870" y="400" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="500" fill="#173f52">または</text><text x="870" y="450" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">P = F × v</text><text x="600" y="590" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">同じ仕事量でも、短い時間で行えばパワーは大きい</text>
</svg>