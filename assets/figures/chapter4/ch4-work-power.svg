<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">仕事とパワー</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">仕事量と、その仕事をどれだけ短時間で行ったかを分けて考える</text>
<rect x="70" y="135" width="480" height="390" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="310" y="180" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="28" font-weight="700" fill="#173f52">仕事 Work</text><text x="310" y="225" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="23" font-weight="500" fill="#5f747a">力 × 移動距離</text><line x1="155" y1="365" x2="435" y2="365" stroke="#2c7a7b" stroke-width="9"/><polygon points="435,365 417,355 417,375" fill="#2c7a7b"/><text x="155" y="330" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="27" font-weight="700" fill="#2c7a7b">F</text><text x="300" y="410" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="27" font-weight="700" fill="#2c7a7b">d</text><rect x="145" y="450" width="330" height="60" rx="14" fill="#eaf2f3" stroke="#7d9aa0" stroke-width="2"/><text x="310" y="490" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="28" font-weight="700" fill="#173f52">W = F × d</text><rect x="650" y="135" width="480" height="390" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="890" y="180" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="28" font-weight="700" fill="#173f52">パワー Power</text><text x="890" y="225" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="23" font-weight="500" fill="#5f747a">仕事 ÷ 時間</text><text x="890" y="330" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="30" font-weight="700" fill="#2c7a7b">W</text><line x1="890" y1="345" x2="890" y2="420" stroke="#173f52" stroke-width="4"/><text x="890" y="455" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="30" font-weight="700" fill="#2c7a7b">t</text><rect x="725" y="450" width="330" height="60" rx="14" fill="#eaf2f3" stroke="#7d9aa0" stroke-width="2"/><text x="890" y="490" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="26" font-weight="700" fill="#173f52">P = W / t = F × v</text><text x="600" y="665" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#5f747a">同じ仕事量でも、短時間で行うほどパワーは大きい</text></svg>
