<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="#fff"/>
<text x="50" y="58" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#173f42">運動の分類と3つの解剖学的平面</text>
<g font-family="Arial, 'Noto Sans JP', sans-serif" fill="#222">
<text x="70" y="115" font-size="24" font-weight="700">運動の分類</text>
<rect x="70" y="145" width="390" height="150" rx="18" fill="#f3f7f7" stroke="#8aa" stroke-width="2"/>
<text x="100" y="185" font-size="24" font-weight="700">線運動</text><text x="100" y="225" font-size="20">直線・曲線に沿って移動</text>
<line x1="110" y1="260" x2="400" y2="260" stroke="#174f52" stroke-width="8"/><path d="M400 260 l-22 -14 v28 z" fill="#174f52"/>
<rect x="540" y="145" width="390" height="150" rx="18" fill="#f3f7f7" stroke="#8aa" stroke-width="2"/>
<text x="570" y="185" font-size="24" font-weight="700">角運動</text><text x="570" y="225" font-size="20">固定軸を中心に回転</text>
<circle cx="735" cy="260" r="18" fill="#174f52"/><path d="M735 260 C850 160 900 270 790 315" fill="none" stroke="#174f52" stroke-width="8"/><path d="M790 315 l5 -28 23 18 z" fill="#174f52"/>
<text x="70" y="365" font-size="24" font-weight="700">3つの解剖学的平面</text>
<rect x="70" y="395" width="250" height="145" rx="16" fill="#fafafa" stroke="#aaa"/><rect x="375" y="395" width="250" height="145" rx="16" fill="#fafafa" stroke="#aaa"/><rect x="680" y="395" width="250" height="145" rx="16" fill="#fafafa" stroke="#aaa"/>
<text x="195" y="435" text-anchor="middle" font-size="23" font-weight="700">矢状面</text><text x="195" y="472" text-anchor="middle" font-size="18">左右に分ける</text><text x="195" y="505" text-anchor="middle" font-size="18">屈曲・伸展</text>
<text x="500" y="435" text-anchor="middle" font-size="23" font-weight="700">前額面</text><text x="500" y="472" text-anchor="middle" font-size="18">前後に分ける</text><text x="500" y="505" text-anchor="middle" font-size="18">外転・内転</text>
<text x="805" y="435" text-anchor="middle" font-size="23" font-weight="700">水平面</text><text x="805" y="472" text-anchor="middle" font-size="18">上下に分ける</text><text x="805" y="505" text-anchor="middle" font-size="18">回旋</text></g>
</svg>