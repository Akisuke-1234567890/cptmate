<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">運動の分類と3つの解剖学的平面</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">線運動・角運動と、矢状面・前額面・水平面の対応</text>
<rect x="60" y="125" width="500" height="220" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="90" y="165" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="27" font-weight="700" fill="#173f52">線運動 Linear motion</text><text x="90" y="205" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="500" fill="#5f747a">直線または曲線に沿って物体が移動</text><line x1="105" y1="270" x2="430" y2="270" stroke="#173f52" stroke-width="8"/><line x1="430" y1="270" x2="490" y2="270" stroke="#2c7a7b" stroke-width="8"/><polygon points="490,270 472,260 472,280" fill="#2c7a7b"/><text x="105" y="315" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">移動</text><rect x="640" y="125" width="500" height="220" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="670" y="165" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="27" font-weight="700" fill="#173f52">角運動 Angular motion</text><text x="670" y="205" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="500" fill="#5f747a">固定された軸を中心に物体が回転</text><circle cx="785" cy="270" r="16" fill="#173f52"/><path d="M785 210 A65 65 0 1 1 770 334" fill="none" stroke="#2c7a7b" stroke-width="9"/><polygon points="770,334 785,312 796,338" fill="#2c7a7b"/><text x="875" y="315" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">回転軸</text><text x="60" y="400" text-anchor="start" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="27" font-weight="700" fill="#173f52">3つの解剖学的平面</text><rect x="60" y="430" width="320" height="190" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="220" y="470" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="26" font-weight="700" fill="#173f52">矢状面</text><text x="220" y="510" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="500" fill="#5f747a">左右に分ける</text><text x="220" y="555" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="24" font-weight="700" fill="#173f52">屈曲・伸展</text><rect x="420" y="430" width="320" height="190" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="580" y="470" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="26" font-weight="700" fill="#173f52">前額面</text><text x="580" y="510" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="500" fill="#5f747a">前後に分ける</text><text x="580" y="555" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="24" font-weight="700" fill="#173f52">外転・内転</text><rect x="780" y="430" width="320" height="190" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="940" y="470" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="26" font-weight="700" fill="#173f52">水平面</text><text x="940" y="510" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="500" fill="#5f747a">上下に分ける</text><text x="940" y="555" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="24" font-weight="700" fill="#173f52">回旋</text><text x="600" y="670" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#5f747a">身体動作は、線運動と角運動が組み合わさって生じる</text></svg>
