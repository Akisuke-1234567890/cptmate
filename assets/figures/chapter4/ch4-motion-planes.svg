<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="32" fill="#f7fbfb"/>
<text x="60" y="58" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">図4.1 運動の分類と解剖学的平面</text>
<text x="60" y="94" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" fill="#5f747a">線運動・角運動と3平面の対応を構造として示す</text>
<rect x="60" y="135" width="510" height="245" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="630" y="135" width="510" height="245" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><text x="315" y="180" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="28" font-weight="700" fill="#173f52">線運動</text><text x="315" y="220" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="500" fill="#173f52">直線運動・曲線運動</text><line x1="150" y1="295" x2="470" y2="295" stroke="#173f52" stroke-width="8"/><text x="315" y="340" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="500" fill="#173f52">物体の位置が移動</text><text x="885" y="180" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="28" font-weight="700" fill="#173f52">角運動</text><text x="885" y="220" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="500" fill="#173f52">固定された軸を中心に回転</text><line x1="780" y1="295" x2="930" y2="295" stroke="#173f52" stroke-width="8"/><circle cx="855" cy="295" r="16" fill="#173f52"/><path d="M855 295 A95 95 0 0 1 935 220" fill="none" stroke="#8a5a2b" stroke-width="8"/><polygon points="935,220 914,223 926,241" fill="#8a5a2b"/><text x="885" y="340" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="500" fill="#173f52">角度・角速度などで記述</text><text x="600" y="430" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="24" font-weight="700" fill="#173f52">身体動作では線運動と角運動が組み合わさる</text><rect x="90" y="485" width="300" height="150" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="450" y="485" width="300" height="150" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="810" y="485" width="300" height="150" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><text x="240" y="530" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">矢状面</text><text x="240" y="570" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="19" font-weight="500" fill="#173f52">左右に分ける</text><text x="240" y="610" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">屈曲・伸展</text><text x="600" y="530" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">前額面</text><text x="600" y="570" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="19" font-weight="500" fill="#173f52">前後に分ける</text><text x="600" y="610" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">外転・内転</text><text x="960" y="530" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">水平面</text><text x="960" y="570" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="19" font-weight="500" fill="#173f52">上下に分ける</text><text x="960" y="610" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">回旋</text>
</svg>