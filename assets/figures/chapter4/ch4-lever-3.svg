<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="32" fill="#f7fbfb"/>
<text x="60" y="58" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">図4.3 第一のてこ</text>
<text x="60" y="94" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" fill="#5f747a">支点が力と抗力の間</text>
<rect x="100" y="160" width="1000" height="350" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><line x1="180" y1="360" x2="1020" y2="360" stroke="#173f52" stroke-width="10"/><polygon points="580,360 620,360 600,430" fill="#173f52"/><text x="600" y="475" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">支点が力と抗力の間</text><circle cx="180" cy="360" r="16" fill="#8a5a2b"/><text x="180" y="325" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="700" fill="#8a5a2b">作用力</text><polygon points="572,360 628,360 600,420" fill="#173f52"/><text x="600" y="325" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">支点</text><circle cx="1000" cy="360" r="16" fill="#173f52"/><text x="1000" y="325" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">抗力</text><text x="600" y="575" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">分類は「支点・作用力・抗力」の位置関係で決まる</text>
</svg>