<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="32" fill="#f7fbfb"/>
<text x="60" y="58" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">図4.14 流体抵抗の関係</text>
<text x="60" y="94" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" fill="#5f747a">速度の二乗に比例する流体抵抗</text>
<rect x="90" y="150" width="1020" height="390" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><text x="600" y="205" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="30" font-weight="700" fill="#173f52">流体抵抗</text><text x="600" y="260" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="38" font-weight="700" fill="#173f52">FR ∝ ρ A v²</text><text x="600" y="315" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="500" fill="#173f52">抵抗は密度 ρ・面積 A・速度 v の二乗に比例</text><rect x="150" y="370" width="380" height="110" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="670" y="370" width="380" height="110" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><text x="340" y="415" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">速度 v</text><text x="340" y="455" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="500" fill="#173f52">1 → 抵抗 1</text><text x="860" y="415" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">速度 2v</text><text x="860" y="455" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" font-weight="700" fill="#8a5a2b">2倍 → 抵抗 4倍</text><text x="600" y="590" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">速度変化の影響が大きいことがポイント</text>
</svg>