<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">筋形状と筋線維の配列</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">筋線維の配列角度と本数は、力発揮や短縮速度に影響する</text>
<rect x="70" y="130" width="340" height="420" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="240" y="175" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">紡錘状筋</text><line x1="125" y1="370" x2="355" y2="370" stroke="#173f52" stroke-width="10"/><line x1="150" y1="235" x2="330" y2="235" stroke="#2c7a7b" stroke-width="7"/><line x1="150" y1="253" x2="330" y2="253" stroke="#2c7a7b" stroke-width="7"/><line x1="150" y1="271" x2="330" y2="271" stroke="#2c7a7b" stroke-width="7"/><line x1="150" y1="289" x2="330" y2="289" stroke="#2c7a7b" stroke-width="7"/><line x1="150" y1="307" x2="330" y2="307" stroke="#2c7a7b" stroke-width="7"/><line x1="150" y1="325" x2="330" y2="325" stroke="#2c7a7b" stroke-width="7"/><text x="240" y="455" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">筋線維が収縮方向とほぼ平行</text><rect x="430" y="130" width="340" height="420" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="600" y="175" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">半羽状筋</text><line x1="485" y1="370" x2="715" y2="370" stroke="#173f52" stroke-width="10"/><line x1="525" y1="235" x2="600" y2="280" stroke="#2c7a7b" stroke-width="7"/><line x1="525" y1="253" x2="600" y2="298" stroke="#2c7a7b" stroke-width="7"/><line x1="525" y1="271" x2="600" y2="316" stroke="#2c7a7b" stroke-width="7"/><line x1="525" y1="289" x2="600" y2="334" stroke="#2c7a7b" stroke-width="7"/><line x1="525" y1="307" x2="600" y2="352" stroke="#2c7a7b" stroke-width="7"/><line x1="525" y1="325" x2="600" y2="370" stroke="#2c7a7b" stroke-width="7"/><text x="600" y="455" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">筋線維が腱に対して斜めに配列</text><rect x="790" y="130" width="340" height="420" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="960" y="175" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">両羽状筋</text><line x1="845" y1="370" x2="1075" y2="370" stroke="#173f52" stroke-width="10"/><line x1="960" y1="280" x2="1040" y2="235" stroke="#2c7a7b" stroke-width="7"/><line x1="960" y1="298" x2="1040" y2="253" stroke="#2c7a7b" stroke-width="7"/><line x1="960" y1="316" x2="1040" y2="271" stroke="#2c7a7b" stroke-width="7"/><line x1="960" y1="334" x2="1040" y2="289" stroke="#2c7a7b" stroke-width="7"/><line x1="960" y1="352" x2="1040" y2="307" stroke="#2c7a7b" stroke-width="7"/><line x1="960" y1="370" x2="1040" y2="325" stroke="#2c7a7b" stroke-width="7"/><text x="960" y="455" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">中央腱の両側に筋線維が配列</text><text x="600" y="665" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#5f747a">羽状筋は筋線維を密に配置しやすく、力発揮に有利</text></svg>
