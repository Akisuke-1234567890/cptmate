<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">レジスタンスエクササイズの3つの抵抗タイプ</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">可動域を通じた抵抗の変化と、力に応じた抵抗の変化を区別する</text>
<rect x="55" y="135" width="350" height="450" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="230" y="180" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#2c7a7b">不変抵抗</text><text x="230" y="215" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="700" fill="#5f747a">Constant</text><text x="230" y="285" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#173f52">可動域を通じて外的抵抗が変化しない</text><rect x="95" y="345" width="270" height="80" rx="12" fill="#eaf2f3" stroke="#7d9aa0" stroke-width="2"/><text x="230" y="395" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">フリーウェイト</text><line x1="120" y1="480" x2="340" y2="480" stroke="#2c7a7b" stroke-width="9"/><text x="230" y="530" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#2c7a7b">一定</text><rect x="440" y="135" width="350" height="450" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="615" y="180" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#8a5a2b">可変抵抗</text><text x="615" y="215" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="700" fill="#5f747a">Variable</text><text x="615" y="285" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#173f52">可動域によって抵抗が増減する</text><rect x="480" y="345" width="270" height="80" rx="12" fill="#eaf2f3" stroke="#7d9aa0" stroke-width="2"/><text x="615" y="395" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">カム・バンド・チェーン</text><path d="M505 490 C570 500 630 460 725 440" fill="none" stroke="#8a5a2b" stroke-width="9"/><text x="615" y="530" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#8a5a2b">増減</text><rect x="825" y="135" width="350" height="450" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="1000" y="180" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">調整抵抗</text><text x="1000" y="215" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="700" fill="#5f747a">Accommodating</text><text x="1000" y="285" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#173f52">加えた力・努力に応じて抵抗が変化する</text><rect x="865" y="345" width="270" height="80" rx="12" fill="#eaf2f3" stroke="#7d9aa0" stroke-width="2"/><text x="1000" y="395" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">等速性・流体・フライホイール</text><line x1="890" y1="490" x2="1110" y2="490" stroke="#173f52" stroke-width="9"/><text x="1000" y="530" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">努力に合わせる</text><text x="600" y="665" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#5f747a">「抵抗が何によって変化するか」で3タイプを判別する</text></svg>
