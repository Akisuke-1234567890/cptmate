<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="#fff"/>
<text x="50" y="58" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#173f42">レジスタンスエクササイズの3つの抵抗タイプ</text>
<g font-family="Arial, 'Noto Sans JP', sans-serif" fill="#222">
<text x="210" y="115" text-anchor="middle" font-size="23" font-weight="700">不変抵抗</text><text x="500" y="115" text-anchor="middle" font-size="23" font-weight="700">可変抵抗</text><text x="790" y="115" text-anchor="middle" font-size="23" font-weight="700">調整抵抗</text>
<line x1="80" y1="470" x2="340" y2="470" stroke="#444" stroke-width="3"/><line x1="370" y1="470" x2="630" y2="470" stroke="#444" stroke-width="3"/><line x1="660" y1="470" x2="920" y2="470" stroke="#444" stroke-width="3"/>
<line x1="110" y1="250" x2="310" y2="250" stroke="#174f52" stroke-width="10"/><text x="210" y="300" text-anchor="middle" font-size="18">一定の外的抵抗</text><text x="210" y="340" text-anchor="middle" font-size="17">フリーウェイト</text>
<path d="M400 400 C470 350 530 260 600 180" fill="none" stroke="#174f52" stroke-width="9"/><text x="500" y="430" text-anchor="middle" font-size="18">伸張・挙上に伴い増減</text><text x="500" y="465" text-anchor="middle" font-size="17">バンド・チェーン・カム</text>
<path d="M700 400 C760 400 800 330 850 240" fill="none" stroke="#c55" stroke-width="9"/><text x="790" y="430" text-anchor="middle" font-size="18">努力・速度に応じて変化</text><text x="790" y="465" text-anchor="middle" font-size="17">流体抵抗・等速性</text>
<text x="500" y="555" text-anchor="middle" font-size="21" font-weight="700">流体抵抗：FR ∝ ρAv²　→ 速度2倍なら抵抗4倍</text></g>
</svg>