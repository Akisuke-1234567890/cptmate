<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="32" fill="#f7fbfb"/>
<text x="60" y="58" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">図4.13 レジスタンスの3タイプ</text>
<text x="60" y="94" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="20" fill="#5f747a">不変・可変・調整抵抗の違い</text>
<rect x="55" y="145" width="350" height="400" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="425" y="145" width="350" height="400" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><rect x="795" y="145" width="350" height="400" rx="20" fill="#fff" stroke="#7d9aa0" stroke-width="2"/><text x="230" y="190" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="26" font-weight="700" fill="#173f52">不変抵抗</text><text x="230" y="225" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="18" font-weight="500" fill="#173f52">Constant</text><line x1="130" y1="360" x2="330" y2="360" stroke="#173f52" stroke-width="10"/><text x="230" y="425" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="19" font-weight="500" fill="#173f52">可動域を通じて</text><text x="230" y="460" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">外的抵抗が一定</text><text x="600" y="190" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="26" font-weight="700" fill="#173f52">可変抵抗</text><text x="600" y="225" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="18" font-weight="500" fill="#173f52">Variable</text><path d="M500 420 C560 390 620 330 700 260" fill="none" stroke="#8a5a2b" stroke-width="10"/><text x="600" y="425" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="19" font-weight="500" fill="#173f52">可動域で抵抗が</text><text x="600" y="460" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">増加・減少する</text><text x="970" y="190" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="26" font-weight="700" fill="#173f52">調整抵抗</text><text x="970" y="225" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="18" font-weight="500" fill="#173f52">Accommodating</text><line x1="870" y1="360" x2="1070" y2="360" stroke="#173f52" stroke-width="10"/><text x="970" y="425" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="18" font-weight="500" fill="#173f52">加えられる力・速度に</text><text x="970" y="460" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">応じて抵抗が変化</text><text x="600" y="610" text-anchor="middle" font-family="Noto Sans JP,Hiragino Sans,Yu Gothic,Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">「抵抗が何によって変化するか」で3タイプを判別</text>
</svg>