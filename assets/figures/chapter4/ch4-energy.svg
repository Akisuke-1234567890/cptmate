<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">力学的エネルギーの分類</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">運動・位置・変形という「状態」によるエネルギーの違い</text>
<rect x="370" y="125" width="460" height="90" rx="18" fill="#eaf2f3" stroke="#7d9aa0" stroke-width="2"/><text x="600" y="182" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="30" font-weight="700" fill="#173f52">力学的エネルギー</text><rect x="70" y="280" width="265" height="245" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="202" y="325" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">線運動エネルギー</text><text x="202" y="385" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="24" font-weight="700" fill="#2c7a7b">LKE = 1/2 m v²</text><text x="202" y="440" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">速度vの二乗に依存</text><rect x="335" y="280" width="265" height="245" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="467" y="325" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">角運動エネルギー</text><text x="467" y="385" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="24" font-weight="700" fill="#2c7a7b">AKE = 1/2 I ω²</text><text x="467" y="440" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">角速度ωの二乗に依存</text><rect x="600" y="280" width="265" height="245" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="732" y="325" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">位置エネルギー</text><text x="732" y="385" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="24" font-weight="700" fill="#2c7a7b">PE = mgh</text><text x="732" y="440" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">高さhに依存</text><rect x="865" y="280" width="265" height="245" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="997" y="325" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="22" font-weight="700" fill="#173f52">変形エネルギー</text><text x="997" y="385" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="24" font-weight="700" fill="#2c7a7b">SE</text><text x="997" y="440" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">弾性変形に蓄えられる</text><text x="600" y="650" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" font-weight="700" fill="#5f747a">運動しているか・位置が高いか・変形しているかで整理すると理解しやすい</text></svg>
