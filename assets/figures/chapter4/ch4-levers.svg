<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="60" y="58" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="34" font-weight="700" fill="#173f52">3種類のてこ：支点・作用力・抗力の位置関係</text>
<text x="60" y="92" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="20" fill="#5f747a">第一・第二・第三のてこを、3要素の配置で見分ける</text>
<rect x="50" y="130" width="350" height="390" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="225" y="175" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">第一のてこ</text><line x1="95" y1="300" x2="355" y2="300" stroke="#173f52" stroke-width="10"/><line x1="225" y1="300" x2="225" y2="380" stroke="#7d9aa0" stroke-width="5"/><polygon points="205,380 245,380 225,340" fill="#173f52"/><text x="120" y="275" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">作用力</text><text x="225" y="275" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">支点</text><text x="330" y="275" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">抗力</text><text x="225" y="435" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#173f52">支点が中央</text><rect x="430" y="130" width="350" height="390" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="605" y="175" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">第二のてこ</text><line x1="475" y1="300" x2="735" y2="300" stroke="#173f52" stroke-width="10"/><line x1="605" y1="300" x2="605" y2="380" stroke="#7d9aa0" stroke-width="5"/><polygon points="585,380 625,380 605,340" fill="#2c7a7b"/><text x="500" y="275" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">支点</text><text x="605" y="275" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">抗力</text><text x="710" y="275" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">作用力</text><text x="605" y="435" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#2c7a7b">抗力が中央</text><rect x="810" y="130" width="350" height="390" rx="20" fill="#ffffff" stroke="#7d9aa0" stroke-width="2"/><text x="985" y="175" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="25" font-weight="700" fill="#173f52">第三のてこ</text><line x1="855" y1="300" x2="1115" y2="300" stroke="#173f52" stroke-width="10"/><line x1="985" y1="300" x2="985" y2="380" stroke="#7d9aa0" stroke-width="5"/><polygon points="965,380 1005,380 985,340" fill="#8a5a2b"/><text x="880" y="275" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">支点</text><text x="985" y="275" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">作用力</text><text x="1090" y="275" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="19" font-weight="700" fill="#173f52">抗力</text><text x="985" y="435" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#8a5a2b">作用力が中央</text><text x="985" y="475" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="18" font-weight="500" fill="#5f747a">人体の関節は主に第三のてこ</text><text x="600" y="665" text-anchor="middle" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',Arial,sans-serif" font-size="21" font-weight="700" fill="#5f747a">支点（軸）・作用力（筋力）・抗力（負荷）の順序で分類する</text></svg>
