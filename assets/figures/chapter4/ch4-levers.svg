<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620">
<rect width="1000" height="620" fill="#fff"/>
<text x="50" y="58" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="30" font-weight="700" fill="#173f42">3種類のてこ：支点・作用力・抗力の位置関係</text>
<g font-family="Arial, 'Noto Sans JP', sans-serif" fill="#222">
<text x="90" y="120" font-size="23" font-weight="700">第一のてこ</text><text x="415" y="120" font-size="23" font-weight="700">第二のてこ</text><text x="740" y="120" font-size="23" font-weight="700">第三のてこ</text>
<!-- beams -->
<g stroke="#555" stroke-width="14" stroke-linecap="round"><line x1="60" y1="260" x2="330" y2="260"/><line x1="385" y1="260" x2="655" y2="260"/><line x1="710" y1="260" x2="980" y2="260"/></g>
<!-- fulcrums -->
<path d="M195 300 l-28 45 h56 z" fill="#174f52"/><path d="M395 300 l-28 45 h56 z" fill="#174f52"/><path d="M755 300 l-28 45 h56 z" fill="#174f52"/>
<!-- forces -->
<path d="M85 205 v-55 l-13 20 h26 z" fill="#c55"/><path d="M300 205 v-55 l-13 20 h26 z" fill="#777"/>
<path d="M500 205 v-55 l-13 20 h26 z" fill="#c55"/><path d="M600 205 v-55 l-13 20 h26 z" fill="#777"/>
<path d="M820 205 v-55 l-13 20 h26 z" fill="#c55"/><path d="M960 205 v-55 l-13 20 h26 z" fill="#777"/>
<text x="195" y="390" text-anchor="middle" font-size="19">支点が中央</text><text x="520" y="390" text-anchor="middle" font-size="19">抗力が中央</text><text x="845" y="390" text-anchor="middle" font-size="19">作用力が中央</text>
<text x="85" y="135" text-anchor="middle" font-size="18">作用力</text><text x="300" y="135" text-anchor="middle" font-size="18">抗力</text><text x="500" y="135" text-anchor="middle" font-size="18">作用力</text><text x="600" y="135" text-anchor="middle" font-size="18">抗力</text><text x="820" y="135" text-anchor="middle" font-size="18">作用力</text><text x="960" y="135" text-anchor="middle" font-size="18">抗力</text>
<text x="500" y="500" text-anchor="middle" font-size="22" font-weight="700">人体の関節は主に第三のてこ</text><text x="500" y="540" text-anchor="middle" font-size="18">第三のてこでは抗力側が力学的に有利</text></g>
</svg>