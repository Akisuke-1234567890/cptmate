<rect width="1200" height="820" rx="34" fill="#f7fbfb"/>
<text x="70" y="70" font-family="Noto Sans CJK JP, sans-serif" font-size="32" font-weight="700" fill="#173e41">神経から筋収縮までの流れ</text>
<text x="70" y="105" font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#70888a">神経筋接合部からCa²⁺放出、トロポニン結合、クロスブリッジ形成まで</text>
<rect x="60" y="150" width="330" height="105" rx="22" fill="#e6f4f3" stroke="#9fcfcd" stroke-width="2" filter="url(#shadow)"/><circle cx="92" cy="182" r="20" fill="#0f6b70"/><text x="92" y="189" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="white">1</text><text x="125" y="192" font-family="Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" fill="#173e41">① 活動電位</text><text x="125" y="222" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#617a7c">運動神経の終末へ到達</text><rect x="440" y="150" width="330" height="105" rx="22" fill="#e6f4f3" stroke="#9fcfcd" stroke-width="2" filter="url(#shadow)"/><circle cx="472" cy="182" r="20" fill="#0f6b70"/><text x="472" y="189" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="white">2</text><text x="505" y="192" font-family="Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" fill="#173e41">② ACh放出</text><text x="505" y="222" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#617a7c">神経筋接合部のシナプス間隙へ</text><rect x="820" y="150" width="330" height="105" rx="22" fill="#e6f4f3" stroke="#9fcfcd" stroke-width="2" filter="url(#shadow)"/><circle cx="852" cy="182" r="20" fill="#0f6b70"/><text x="852" y="189" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="white">3</text><text x="885" y="192" font-family="Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" fill="#173e41">③ ACh受容体</text><text x="885" y="222" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#617a7c">筋鞘の受容体に結合</text><rect x="60" y="360" width="330" height="105" rx="22" fill="#e6f4f3" stroke="#9fcfcd" stroke-width="2" filter="url(#shadow)"/><circle cx="92" cy="392" r="20" fill="#0f6b70"/><text x="92" y="399" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="white">4</text><text x="125" y="402" font-family="Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" fill="#173e41">④ T管伝導</text><text x="125" y="432" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#617a7c">活動電位が筋線維内部へ</text><rect x="440" y="360" width="330" height="105" rx="22" fill="#e6f4f3" stroke="#9fcfcd" stroke-width="2" filter="url(#shadow)"/><circle cx="472" cy="392" r="20" fill="#0f6b70"/><text x="472" y="399" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="white">5</text><text x="505" y="402" font-family="Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" fill="#173e41">⑤ Ca²⁺放出</text><text x="505" y="432" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#617a7c">筋小胞体から筋形質へ</text><rect x="820" y="360" width="330" height="105" rx="22" fill="#fff2df" stroke="#d7b36a" stroke-width="2" filter="url(#shadow)"/><circle cx="852" cy="392" r="20" fill="#0f6b70"/><text x="852" y="399" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="700" fill="white">6</text><text x="885" y="402" font-family="Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" fill="#173e41">⑥ トロポニン結合</text><text x="885" y="432" font-family="Noto Sans CJK JP, sans-serif" font-size="15" fill="#617a7c">Ca²⁺結合で調節タンパク質が変化</text><line x1="390" y1="202" x2="435" y2="202" stroke="#0f6b70" stroke-width="5" marker-end="url(#arrow)"/><line x1="770" y1="202" x2="815" y2="202" stroke="#0f6b70" stroke-width="5" marker-end="url(#arrow)"/><line x1="390" y1="412" x2="435" y2="412" stroke="#0f6b70" stroke-width="5" marker-end="url(#arrow)"/><line x1="770" y1="412" x2="815" y2="412" stroke="#0f6b70" stroke-width="5" marker-end="url(#arrow)"/><rect x="290" y="590" width="620" height="120" rx="24" fill="white" stroke="#b8d6d5" stroke-width="2" filter="url(#shadow)"/>
<text x="600" y="625" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="22" font-weight="700" fill="#173e41">⑦ クロスブリッジ形成 → 力発揮</text>
<text x="600" y="660" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#617a7c">Ca²⁺ → トロポニン → トロポミオシンの位置変化</text>
<text x="600" y="688" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="17" fill="#617a7c">アクチン上の結合部位が露出し、ミオシン頭部が結合する</text><text x="600" y="785" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="14" fill="#809294">※ 模式図。実際の形状・比率とは異なる場合があります。</text></svg>