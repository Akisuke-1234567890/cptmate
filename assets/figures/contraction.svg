<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#fff"/>
<style>.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;fill:#173f42}.h{font-size:38px;font-weight:800}.sh{font-size:27px;font-weight:800}.tx{font-size:21px}.sm{font-size:18px}.b{font-weight:800}.panel{fill:#fbfdfd;stroke:#d4e1e2;stroke-width:3}</style>
