<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#ffffff"/>
<style>
.t{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;fill:#173f42}
.h{font-size:38px;font-weight:800}.sh{font-size:28px;font-weight:800}.tx{font-size:23px}.sm{font-size:19px}.b{font-weight:800}
.panel{fill:#fbfdfd;stroke:#d4e1e2;stroke-width:3}.blue{stroke:#2b69aa}.green{stroke:#4b9a78}.purple{stroke:#6b4a8f}
</style>
<text x="55" y="60" class="t h">フィラメント滑走説：収縮前と収縮後の比較</text>
<rect x="45" y="90" width="1310" height="650" rx="24" class="panel"/>
<line x1="700" y1="120" x2="700" y2="715" stroke="#c7d3d4" stroke-width="2"/>
<text x="90" y="145" class="t sh">収縮前（弛緩時）</text>
<text x="745" y="145" class="t sh">収縮後（収縮時）</text>
<!-- left/right diagrams -->
<g class="t sm">
<text x="105" y="190">Z線</text><text x="590" y="190">Z線</text>
<text x="760" y="190">Z線</text><text x="1245" y="190">Z線</text>
</g>
<!-- Z lines -->
<g class="purple" fill="none" stroke-width="7">
<path d="M110 210 q20 14 0 28 t0 28 t0 28 t0 28 t0 28"/>
<path d="M610 210 q20 14 0 28 t0 28 t0 28 t0 28 t0 28"/>
<path d="M765 210 q20 14 0 28 t0 28 t0 28 t0 28 t0 28"/>
<path d="M1265 210 q20 14 0 28 t0 28 t0 28 t0 28 t0 28"/>
</g>
<!-- filaments -->
<g class="green" stroke-width="8" stroke-linecap="round">
<line x1="120" y1="225" x2="330" y2="225"/><line x1="490" y1="225" x2="600" y2="225"/>
<line x1="120" y1="270" x2="330" y2="270"/><line x1="490" y1="270" x2="600" y2="270"/>
<line x1="120" y1="315" x2="330" y2="315"/><line x1="490" y1="315" x2="600" y2="315"/>
<line x1="120" y1="360" x2="330" y2="360"/><line x1="490" y1="360" x2="600" y2="360"/>
</g>
<g class="blue" stroke-width="12" stroke-linecap="round">
<line x1="330" y1="225" x2="500" y2="225"/><line x1="330" y1="270" x2="500" y2="270"/><line x1="330" y1="315" x2="500" y2="315"/><line x1="330" y1="360" x2="500" y2="360"/>
</g>
<g class="green" stroke-width="8" stroke-linecap="round">
<line x1="775" y1="225" x2="390" y2="225"/><line x1="880" y1="225" x2="1260" y2="225"/>
<line x1="775" y1="270" x2="390" y2="270"/><line x1="880" y1="270" x2="1260" y2="270"/>
<line x1="775" y1="315" x2="390" y2="315"/><line x1="880" y1="315" x2="1260" y2="315"/>
<line x1="775" y1="360" x2="390" y2="360"/><line x1="880" y1="360" x2="1260" y2="360"/>
</g>
<g class="blue" stroke-width="12" stroke-linecap="round">
<line x1="880" y1="225" x2="1150" y2="225"/><line x1="880" y1="270" x2="1150" y2="270"/><line x1="880" y1="315" x2="1150" y2="315"/><line x1="880" y1="360" x2="1150" y2="360"/>
</g>
<!-- bands -->
<g class="t sm" text-anchor="middle">
<text x="215" y="420">I帯</text><text x="415" y="420">A帯</text><text x="540" y="420">I帯</text>
<text x="825" y="420">I帯</text><text x="1015" y="420">A帯</text><text x="1215" y="420">I帯</text>
<text x="415" y="455">H帯</text><text x="1015" y="455">H帯</text><text x="415" y="490">M線</text><text x="1015" y="490">M線</text>
</g>
<!-- legend -->
<g class="t sm">
<line x1="85" y1="550" x2="160" y2="550" stroke="#4b9a78" stroke-width="8"/><text x="175" y="557">アクチン（細いフィラメント）</text>
<line x1="85" y1="590" x2="160" y2="590" stroke="#2b69aa" stroke-width="12"/><text x="175" y="598">ミオシン（太いフィラメント）</text>
<path d="M85 625 q12 8 0 16 t0 16" stroke="#6b4a8f" fill="none" stroke-width="6"/><text x="175" y="645">Z線</text>
</g>
<rect x="700" y="530" width="610" height="150" rx="18" fill="#eef7f6" stroke="#b9d4d5" stroke-width="2"/>
<text x="730" y="570" class="t tx b">収縮時のポイント</text>
<text x="730" y="607" class="t tx">・フィラメント自体の長さは変わらない</text>
<text x="730" y="640" class="t tx">・アクチンが中央へ滑り込み、Z線間が短くなる</text>
<text x="730" y="673" class="t tx">・I帯とH帯は短くなる／A帯は変化しない</text>
<text x="55" y="790" class="t sm">※ CPTmate学習用模式図。教材の構造・関係をもとに再構成。</text>
</svg>