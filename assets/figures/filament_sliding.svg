<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d8587"/></marker></defs><style>.title{font:700 30px sans-serif;fill:#173f43}.sub{font:600 18px sans-serif;fill:#557276}.label{font:600 16px sans-serif;fill:#173f43}.small{font:500 13px sans-serif;fill:#557276}.box{fill:#fff;stroke:#cbdedf;stroke-width:2}.teal{fill:#176b70}.green{stroke:#4c9f84}.blue{stroke:#2867a8}.orange{stroke:#d49b45}.red{stroke:#b54848}.purple{stroke:#76508c}.arrow{stroke:#6d8587;stroke-width:4;fill:none;marker-end:url(#a)}.thin{fill:none;stroke-width:4;stroke-linecap:round}</style><rect x="30" y="30" width="1140" height="740" rx="28" fill="#f7fbfb" stroke="#cbdedf" stroke-width="2"/><text x="70" y="80" class="title">フィラメント滑走説：収縮前と収縮後</text><text x="70" y="108" class="sub">フィラメント自体の長さは変わらず、重なりが変化する</text>
<g transform="translate(70 145)"><rect class="box" width="500" height="520" rx="22"/><text x="250" y="45" text-anchor="middle" class="label">収縮前（弛緩時）</text><line x1="55" y1="95" x2="55" y2="360" class="thin purple"/><line x1="445" y1="95" x2="445" y2="360" class="thin purple"/><text x="55" y="390" text-anchor="middle" class="small">Z線</text><text x="445" y="390" text-anchor="middle" class="small">Z線</text>
<g stroke="#2867a8" stroke-width="13" stroke-linecap="round"><line x1="250" y1="140" x2="440" y2="140"/><line x1="250" y1="205" x2="440" y2="205"/><line x1="250" y1="270" x2="440" y2="270"/><line x1="250" y1="335" x2="440" y2="335"/></g><g stroke="#4c9f84" stroke-width="6"><line x1="60" y1="140" x2="250" y2="140"/><line x1="60" y1="205" x2="250" y2="205"/><line x1="60" y1="270" x2="250" y2="270"/><line x1="60" y1="335" x2="250" y2="335"/></g><text x="250" y="430" text-anchor="middle" class="small">A帯：ミオシンの長さに対応</text><text x="250" y="455" text-anchor="middle" class="small">H帯：ミオシンのみ　I帯：アクチンのみ</text></g>
<path d="M600 400h80" class="arrow"/><g transform="translate(630 145)"><rect class="box" width="500" height="520" rx="22"/><text x="250" y="45" text-anchor="middle" class="label">収縮後（収縮時）</text><line x1="110" y1="95" x2="110" y2="360" class="thin purple"/><line x1="390" y1="95" x2="390" y2="360" class="thin purple"/><text x="110" y="390" text-anchor="middle" class="small">Z線</text><text x="390" y="390" text-anchor="middle" class="small">Z線</text><g stroke="#2867a8" stroke-width="13" stroke-linecap="round"><line x1="250" y1="140" x2="385" y2="140"/><line x1="250" y1="205" x2="385" y2="205"/><line x1="250" y1="270" x2="385" y2="270"/><line x1="250" y1="335" x2="385" y2="335"/></g><g stroke="#4c9f84" stroke-width="6"><line x1="115" y1="140" x2="250" y2="140"/><line x1="115" y1="205" x2="250" y2="205"/><line x1="115" y1="270" x2="250" y2="270"/><line x1="115" y1="335" x2="250" y2="335"/></g><text x="250" y="430" text-anchor="middle" class="small">Z線同士が近づく</text><text x="250" y="455" text-anchor="middle" class="small">I帯・H帯は短くなる／A帯は不変</text></g></svg>