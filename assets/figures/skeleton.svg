<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 650"><rect width="700" height="650" rx="28" fill="#f7fbfb"/><text x="350" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#123f42">骨格の区分（模式図）</text><g stroke="#8c8f91" stroke-width="15" stroke-linecap="round" fill="none"><circle cx="350" cy="105" r="38" fill="#e6e1d8"/><line x1="350" y1="145" x2="350" y2="355"/><line x1="285" y1="190" x2="415" y2="190"/><line x1="350" y1="355" x2="275" y2="520"/><line x1="350" y1="355" x2="425" y2="520"/><line x1="275" y1="230" x2="205" y2="335"/><line x1="425" y1="230" x2="495" y2="335"/></g><path d="M350 145V355" stroke="#0d6f72" stroke-width="25"/><path d="M285 190H415" stroke="#0d6f72" stroke-width="20"/><text x="95" y="155" font-size="23" font-weight="700" fill="#123f42">軸性骨格</text><text x="95" y="185" font-size="18" fill="#555">頭蓋・脊柱・胸郭</text><text x="455" y="455" font-size="23" font-weight="700" fill="#123f42">付属性骨格</text><text x="455" y="485" font-size="18" fill="#555">上肢・下肢</text><text x="350" y="600" text-anchor="middle" font-size="20" fill="#555">人体の骨格は軸性骨格と付属性骨格に分類される</text></svg>