<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6d8587"/></marker></defs><style>.title{font:700 30px sans-serif;fill:#173f43}.sub{font:600 18px sans-serif;fill:#557276}.label{font:600 16px sans-serif;fill:#173f43}.small{font:500 13px sans-serif;fill:#557276}.box{fill:#fff;stroke:#cbdedf;stroke-width:2}.teal{fill:#176b70}.green{stroke:#4c9f84}.blue{stroke:#2867a8}.orange{stroke:#d49b45}.red{stroke:#b54848}.purple{stroke:#76508c}.arrow{stroke:#6d8587;stroke-width:4;fill:none;marker-end:url(#a)}.thin{fill:none;stroke-width:4;stroke-linecap:round}</style><rect x="30" y="30" width="1140" height="740" rx="28" fill="#f7fbfb" stroke="#cbdedf" stroke-width="2"/><text x="70" y="80" class="title">軸性骨格と付属性骨格</text><text x="70" y="108" class="sub">骨格系の2つの区分と主な構成</text>
<g transform="translate(55 145)"><rect class="box" width="330" height="510" rx="22" fill="#eef8f8"/><text x="165" y="45" text-anchor="middle" class="label">軸性骨格</text><text x="45" y="90" class="small">・頭蓋骨</text><text x="45" y="122" class="small">・脊柱</text><text x="45" y="154" class="small">・肋骨</text><text x="45" y="186" class="small">・胸骨</text><rect x="35" y="390" width="260" height="80" rx="15" fill="#dcefed"/><text x="165" y="420" text-anchor="middle" class="label">体幹の支持・保護</text><text x="165" y="445" text-anchor="middle" class="small">頭部・脊柱・胸郭を構成</text></g>
<g transform="translate(810 145)"><rect class="box" width="330" height="510" rx="22" fill="#fff4e8"/><text x="165" y="45" text-anchor="middle" class="label">付属性骨格</text><text x="45" y="90" class="small">・上肢骨</text><text x="45" y="122" class="small">・下肢骨</text><text x="45" y="154" class="small">・肩甲帯（鎖骨・肩甲骨）</text><text x="45" y="186" class="small">・骨盤帯</text><rect x="35" y="390" width="260" height="80" rx="15" fill="#fff0dd"/><text x="165" y="420" text-anchor="middle" class="label">運動の実行・力の発揮</text><text x="165" y="445" text-anchor="middle" class="small">四肢と帯を構成</text></g>
