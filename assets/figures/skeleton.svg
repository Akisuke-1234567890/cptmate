<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760"><defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7fbfb"/><stop offset="1" stop-color="#eef7f6"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#145e62"/><stop offset="1" stop-color="#2d8585"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#163f43" flood-opacity=".13"/></filter>
</defs>
<rect width="1200" height="760" rx="28" fill="url(#bg)"/>
<text x="60" y="65" font-family="sans-serif" font-size="34" font-weight="800" fill="#173f43">軸性骨格と付属性骨格</text>
<text x="60" y="98" font-family="sans-serif" font-size="18" fill="#6b8587">身体の中心軸を構成する骨格と、四肢・帯を構成する骨格</text>
<!-- silhouette skeleton -->
<g transform="translate(470,125)" stroke-linecap="round" stroke-linejoin="round">
 <circle cx="130" cy="55" r="38" fill="#dcefee" stroke="#145e62" stroke-width="7"/>
 <path d="M130 95 V285" stroke="#145e62" stroke-width="18"/>
 <path d="M85 135 Q130 110 175 135 M88 160 Q130 135 172 160 M88 185 Q130 160 172 185 M90 210 Q130 185 170 210" fill="none" stroke="#2d8585" stroke-width="8"/>
 <path d="M130 285 L90 430 M130 285 L170 430" stroke="#145e62" stroke-width="15"/>
 <path d="M90 430 L62 585 M170 430 L198 585" stroke="#145e62" stroke-width="13"/>
 <path d="M130 145 L48 235 M130 145 L212 235" stroke="#8fbdb9" stroke-width="15"/>
 <path d="M48 235 L20 350 M212 235 L240 350" stroke="#8fbdb9" stroke-width="13"/>
 <path d="M20 350 L-5 420 M240 350 L265 420" stroke="#8fbdb9" stroke-width="11"/>
 <circle cx="20" cy="420" r="10" fill="#8fbdb9" stroke="none"/><circle cx="265" cy="420" r="10" fill="#8fbdb9" stroke="none"/>
 <circle cx="62" cy="585" r="11" fill="#8fbdb9" stroke="none"/><circle cx="198" cy="585" r="11" fill="#8fbdb9" stroke="none"/>
</g>
<!-- labels -->
<g font-family="sans-serif">
 <g><rect x="70" y="165" width="300" height="180" rx="24" fill="#fff" stroke="#b7d8d5" stroke-width="3"/><text x="220" y="210" text-anchor="middle" font-size="23" font-weight="800" fill="#145e62">軸性骨格</text><text x="105" y="250" font-size="17" fill="#526f71">・頭蓋</text><text x="105" y="280" font-size="17" fill="#526f71">・脊柱</text><text x="105" y="310" font-size="17" fill="#526f71">・胸骨</text><text x="235" y="250" font-size="17" fill="#526f71">・肋骨</text><text x="235" y="280" font-size="17" fill="#526f71">身体の中心軸</text></g>
 <g><rect x="830" y="165" width="300" height="180" rx="24" fill="#fff" stroke="#d7c98f" stroke-width="3"/><text x="980" y="210" text-anchor="middle" font-size="23" font-weight="800" fill="#806d35">付属性骨格</text><text x="865" y="250" font-size="17" fill="#526f71">・肩帯</text><text x="865" y="280" font-size="17" fill="#526f71">・上肢</text><text x="865" y="310" font-size="17" fill="#526f71">・骨盤帯</text><text x="1010" y="250" font-size="17" fill="#526f71">・下肢</text><text x="1010" y="280" font-size="17" fill="#526f71">四肢と帯</text></g>
 <path d="M370 255 H470" stroke="#145e62" stroke-width="5"/><path d="M830 255 H730" stroke="#806d35" stroke-width="5"/>
 <g><rect x="175" y="565" width="850" height="110" rx="24" fill="#fff" stroke="#c8dfdd" stroke-width="3"/><text x="600" y="605" text-anchor="middle" font-size="20" font-weight="800" fill="#173f43">軸性骨格のポイント</text><text x="600" y="638" text-anchor="middle" font-size="16" fill="#526f71">頭蓋・脊柱・胸骨・肋骨などを含み、重要臓器の保護や筋の付着部として機能</text></g>
</g>
<text x="600" y="720" font-family="sans-serif" text-anchor="middle" font-size="15" fill="#718889">※ 模式図。実際の骨の形状・比率とは異なります。</text>
</svg>