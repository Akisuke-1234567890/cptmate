<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720">
<rect width="1200" height="720" rx="36" fill="#f7fbfb"/>
<text x="600" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#174f52">サルコメアの構造</text>
<text x="600" y="92" text-anchor="middle" font-size="20" fill="#6b7f80">Z線から隣接するZ線まで</text>

<!-- bands -->
<rect x="120" y="145" width="180" height="420" fill="#e8f4f3"/>
<rect x="300" y="145" width="600" height="420" fill="#dce8e7"/>
<rect x="900" y="145" width="180" height="420" fill="#e8f4f3"/>
<text x="210" y="185" text-anchor="middle" font-size="24" font-weight="700" fill="#174f52">I帯</text>
<text x="600" y="185" text-anchor="middle" font-size="24" font-weight="700" fill="#174f52">A帯</text>
<text x="600" y="218" text-anchor="middle" font-size="19" fill="#6b7f80">ミオシンが存在する範囲</text>
<rect x="500" y="250" width="200" height="230" rx="12" fill="#c9d5d4" opacity=".85"/>
<text x="600" y="286" text-anchor="middle" font-size="23" font-weight="700" fill="#174f52">H帯</text>
<text x="600" y="316" text-anchor="middle" font-size="17" fill="#6b7f80">ミオシンのみ</text>

<!-- Z lines -->
<line x1="120" y1="130" x2="120" y2="585" stroke="#0d6f73" stroke-width="14"/>
<line x1="1080" y1="130" x2="1080" y2="585" stroke="#0d6f73" stroke-width="14"/>
<text x="120" y="625" text-anchor="middle" font-size="24" font-weight="700" fill="#174f52">Z線</text>
<text x="1080" y="625" text-anchor="middle" font-size="24" font-weight="700" fill="#174f52">Z線</text>

<!-- M line -->
<line x1="600" y1="235" x2="600" y2="500" stroke="#334b4d" stroke-width="7"/>
<text x="600" y="540" text-anchor="middle" font-size="24" font-weight="700" fill="#334b4d">M線</text>

<!-- actin -->
<g stroke="#278f7d" stroke-width="16" stroke-linecap="round">
<line x1="145" y1="270" x2="610" y2="270"/><line x1="145" y1="335" x2="610" y2="335"/>
<line x1="145" y1="400" x2="610" y2="400"/><line x1="145" y1="465" x2="610" y2="465"/>
<line x1="1055" y1="270" x2="590" y2="270"/><line x1="1055" y1="335" x2="590" y2="335"/>
<line x1="1055" y1="400" x2="590" y2="400"/><line x1="1055" y1="465" x2="590" y2="465"/>
</g>
<text x="260" y="245" text-anchor="middle" font-size="22" font-weight="700" fill="#278f7d">アクチン（細い）</text>

<!-- myosin -->
<g stroke="#a64d55" stroke-width="22" stroke-linecap="round">
<line x1="485" y1="270" x2="715" y2="270"/><line x1="485" y1="335" x2="715" y2="335"/>
<line x1="485" y1="400" x2="715" y2="400"/><line x1="485" y1="465" x2="715" y2="465"/>
</g>
<text x="900" y="245" text-anchor="middle" font-size="22" font-weight="700" fill="#a64d55">ミオシン（太い）</text>

<!-- bracket -->
<path d="M120 655 V680 H1080 V655" fill="none" stroke="#174f52" stroke-width="4"/>
<text x="600" y="708" text-anchor="middle" font-size="20" fill="#174f52">1つのサルコメア</text>
</svg>